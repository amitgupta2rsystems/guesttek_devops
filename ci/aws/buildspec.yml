version: 0.2

env:
  shell: bash
  variables:
    GIT_SSH_SECRET_NAME: guesttek/git-ssh-key
    CLONE_ROOT: /tmp/repos
    ORCHESTRATION_DIR: /tmp/repos/guesttek_devops
    PLATFORM: amd64

phases:
  install:
    commands:
      - apt-get update -qq
      - apt-get install -y -qq git openssh-client patch
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do sleep 1; done"
      - chmod +x $CODEBUILD_SRC_DIR/ci/aws/*.sh

  pre_build:
    commands:
      - $CODEBUILD_SRC_DIR/ci/aws/prepare-orchestration.sh
      - $CODEBUILD_SRC_DIR/ci/aws/setup-git-ssh.sh

  build:
    commands:
      - $CODEBUILD_SRC_DIR/ci/aws/clone-service-repos.sh
      - ORCHESTRATION_SRC=$CODEBUILD_SRC_DIR CLONE_ROOT=$CLONE_ROOT $CODEBUILD_SRC_DIR/ci/aws/apply-local-patches.sh
      - export PLATFORM=$PLATFORM
      - CLONE_ROOT=$CLONE_ROOT PLATFORM=$PLATFORM $CODEBUILD_SRC_DIR/ci/aws/build-docker-services.sh

  post_build:
    commands:
      - echo Orchestration dir $ORCHESTRATION_DIR
      - echo Build completed

artifacts:
  files:
    - '**/*'
  name: camsuite-edge-docker-builds
