version: 0.2

env:
  shell: bash
  variables:
    GIT_SSH_PARAM: /guesttek/codebuild/git-ssh-private-key
    CLONE_ROOT: /tmp/repos
    ORCHESTRATION_DIR: /tmp/repos/guesttek_devops
    PLATFORM: amd64
    CAMSUITE_BUNDLE_ARCH: amd64
    BUNDLES_BUCKET: guesttek-edge-bundles-705959604310
    BUNDLES_PREFIX: guesttek/bundles/
    ARTIFACTS_BUCKET: guesttek-camsuite-edge-artifacts-705959604310
    BUILDS_PREFIX: builds
    RELEASE_PREFIX: guesttek-camsuite-edge
    DEV_BUILD_ID_SCRIPT_S3: s3://guesttek-edge-bundles-705959604310/guesttek/ci/resolve-dev-build-id.sh

phases:
  install:
    commands:
      - |
        echo "=============================="
        echo " STAGE: Setup"
        echo "=============================="
        apt-get update -qq
        apt-get install -y -qq git openssh-client patch jq python3 debhelper dpkg-dev fakeroot
        nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
        timeout 15 sh -c "until docker info; do sleep 1; done"
        chmod +x $CODEBUILD_SRC_DIR/ci/aws/*.sh $CODEBUILD_SRC_DIR/scripts/*.sh

  pre_build:
    commands:
      - |
        echo "=============================="
        echo " STAGE: Prepare"
        echo "=============================="
        $CODEBUILD_SRC_DIR/ci/aws/prepare-orchestration.sh
        $CODEBUILD_SRC_DIR/ci/aws/setup-git-ssh.sh
        CLONE_ROOT=$CLONE_ROOT BUNDLES_BUCKET=$BUNDLES_BUCKET BUNDLES_PREFIX=$BUNDLES_PREFIX \
          $CODEBUILD_SRC_DIR/ci/aws/fetch-packaging-repos.sh

  build:
    commands:
      - |
        echo "=============================="
        echo " STAGE: Clone"
        echo "=============================="
        $CODEBUILD_SRC_DIR/ci/aws/clone-service-repos.sh
      - |
        echo "=============================="
        echo " STAGE: Patch"
        echo "=============================="
        ORCHESTRATION_SRC=$CODEBUILD_SRC_DIR CLONE_ROOT=$CLONE_ROOT \
          $CODEBUILD_SRC_DIR/ci/aws/apply-local-patches.sh
      - |
        echo "=============================="
        echo " STAGE: Docker"
        echo "=============================="
        export PLATFORM=$PLATFORM
        CLONE_ROOT=$CLONE_ROOT PLATFORM=$PLATFORM \
          $CODEBUILD_SRC_DIR/ci/aws/build-docker-services.sh
      - |
        echo "=============================="
        echo " STAGE: Package"
        echo "=============================="
        CLONE_ROOT=$CLONE_ROOT $CODEBUILD_SRC_DIR/ci/aws/seed-assemble-configs.sh
        CLONE_ROOT=$CLONE_ROOT CAMSUITE_BUNDLE_ARCH=$CAMSUITE_BUNDLE_ARCH \
          $CODEBUILD_SRC_DIR/ci/aws/package-deb.sh
      - |
        echo "=============================="
        echo " STAGE: Manifest"
        echo "=============================="
        ORCHESTRATION_SRC=$CODEBUILD_SRC_DIR CLONE_ROOT=$CLONE_ROOT PLATFORM=$PLATFORM \
          $CODEBUILD_SRC_DIR/ci/aws/generate-release-manifest.sh

  post_build:
    commands:
      - |
        echo "=============================="
        echo " STAGE: Stage artifacts"
        echo "=============================="
        mkdir -p $CODEBUILD_SRC_DIR/out
        cp -v $CLONE_ROOT/*.deb $CLONE_ROOT/*.changes $CLONE_ROOT/*.buildinfo $CODEBUILD_SRC_DIR/out/ 2>/dev/null || true
        cp -v $CLONE_ROOT/deploy/guesttek-camsuite-edge-*.tar $CODEBUILD_SRC_DIR/out/ 2>/dev/null || true
        cp -v $CLONE_ROOT/guesttek-camsuite-edge/docker/camsuite-images-*.tar $CODEBUILD_SRC_DIR/out/ 2>/dev/null || true
        cp -v $CLONE_ROOT/release-manifest.yaml $CODEBUILD_SRC_DIR/out/ 2>/dev/null || true
        echo "Artifacts in $CODEBUILD_SRC_DIR/out:"
        ls -lah $CODEBUILD_SRC_DIR/out || true

        DEB="$(ls -1 $CODEBUILD_SRC_DIR/out/guesttek-camsuite-edge_*_amd64.deb 2>/dev/null | head -1)"
        if [[ -n "$DEB" && -f "$DEB" ]]; then
          echo "=============================="
          echo " STAGE: Archive build to S3"
          echo "=============================="
          aws s3 cp "$DEV_BUILD_ID_SCRIPT_S3" /tmp/resolve-dev-build-id.sh --region "$AWS_REGION"
          chmod +x /tmp/resolve-dev-build-id.sh
          export ARTIFACTS_BUCKET BUILDS_PREFIX RELEASE_PREFIX AWS_REGION
          DEV_BUILD_ID="$(/tmp/resolve-dev-build-id.sh assign "$DEB")"
          ARCHIVE_URI="s3://${ARTIFACTS_BUCKET}/${BUILDS_PREFIX}/${DEV_BUILD_ID}/camsuite-edge-deb"
          ( cd "$CODEBUILD_SRC_DIR" && zip -qr /tmp/camsuite-edge-deb.zip out )
          echo "Dev build ID: ${DEV_BUILD_ID}"
          echo "Archiving (kept even if LabSmoke fails): ${ARCHIVE_URI}"
          aws s3 cp /tmp/camsuite-edge-deb.zip "$ARCHIVE_URI" --region "$AWS_REGION"
        fi
        echo "Build completed"

artifacts:
  files:
    - out/**/*
  name: camsuite-edge-deb
  discard-paths: no
