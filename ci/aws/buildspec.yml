version: 0.2

env:
  shell: bash
  variables:
    GIT_SSH_SECRET_NAME: guesttek/git-ssh-key
    CLONE_ROOT: /tmp/repos
    ORCHESTRATION_DIR: /tmp/repos/guesttek_devops

phases:
  install:
    commands:
      - apt-get update -qq
      - apt-get install -y -qq git openssh-client
      - chmod +x $CODEBUILD_SRC_DIR/ci/aws/setup-git-ssh.sh $CODEBUILD_SRC_DIR/ci/aws/clone-service-repos.sh $CODEBUILD_SRC_DIR/ci/aws/prepare-orchestration.sh

  pre_build:
    commands:
      - $CODEBUILD_SRC_DIR/ci/aws/prepare-orchestration.sh
      - $CODEBUILD_SRC_DIR/ci/aws/setup-git-ssh.sh

  build:
    commands:
      - $CODEBUILD_SRC_DIR/ci/aws/clone-service-repos.sh

  post_build:
    commands:
      - echo Orchestration dir $ORCHESTRATION_DIR
      - echo Build completed

artifacts:
  files:
    - '**/*'
  name: orchestration-and-services-clone
