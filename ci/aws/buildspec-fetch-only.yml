# CodeBuild — FETCH ONLY (no Docker, no .deb build)
#
# Use this buildspec to test:
#   - GitHub source checkout (guesttek_devops)
#   - SSH secret (guesttek/git-ssh-key)
#   - Clone all 8 service repos from Bitbucket + GitHub
#   - Optional S3 bundles
#
# Create a separate CodeBuild project:
#   Name: guesttek-edge-fetch-only
#   Buildspec: ci/aws/buildspec-fetch-only.yml
#   Privileged: OFF (not needed — no Docker)
#   Timeout: 30 minutes
#   Compute: BUILD_GENERAL1_SMALL
#
# Same env vars as full build (minimum):
#   GIT_SSH_SECRET_NAME=guesttek/git-ssh-key
#   CLONE_REMOTES=1
#   SERVICE_BRANCHES=1
#   BUNDLES_BUCKET=guesttek-edge-bundles-705959604310
#   BUNDLES_PREFIX=guesttek/bundles/

version: 0.2

env:
  shell: bash
  variables:
    MONOREPO: /codebuild/output/guestek-build
    REPORT_DIR: /codebuild/output/fetch-report
    CLONE_REMOTES: "1"
    SERVICE_BRANCHES: "1"
    GIT_SSH_SECRET_NAME: guesttek/git-ssh-key
    AWS_REGION: ap-south-1

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - apt-get update -qq
      - apt-get install -y git openssh-client
      - mkdir -p "$MONOREPO" "$REPORT_DIR"

  pre_build:
    commands:
      - echo "Source (GitHub recipe) at $CODEBUILD_SRC_DIR"
      - ls -la "$CODEBUILD_SRC_DIR/ci/aws/" "$CODEBUILD_SRC_DIR/scripts/service-repos.list"

  build:
    commands:
      - chmod +x "$CODEBUILD_SRC_DIR/ci/aws/fetch-code-only.sh"
      - |
        ORCHESTRATION_SRC="$CODEBUILD_SRC_DIR" \
        MONOREPO="$MONOREPO" \
        REPORT_DIR="$REPORT_DIR" \
        CLONE_REMOTES="$CLONE_REMOTES" \
        SERVICE_BRANCHES="$SERVICE_BRANCHES" \
        GIT_SSH_SECRET_NAME="$GIT_SSH_SECRET_NAME" \
        BUNDLES_BUCKET="${BUNDLES_BUCKET:-}" \
        BUNDLES_PREFIX="${BUNDLES_PREFIX:-}" \
        AWS_REGION="$AWS_REGION" \
        "$CODEBUILD_SRC_DIR/ci/aws/fetch-code-only.sh"

  post_build:
    commands:
      - mkdir -p "$CODEBUILD_SRC_DIR/fetch-report"
      - cp -v "$REPORT_DIR/"* "$CODEBUILD_SRC_DIR/fetch-report/" 2>/dev/null || true
      - echo "=== Cloned directories ==="
      - find "$MONOREPO" -maxdepth 1 -type d -name 'camsuite-*' -o -name '*_service' 2>/dev/null | sort

artifacts:
  files:
    - fetch-report/**/*
  name: guesttek-fetch-only-report
  discard-paths: no
